<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Visualizer - ครูเจม</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #2980b9;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: right;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .math-board {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: right;
            letter-spacing: 5px;
            min-height: 200px;
        }
        .line {
            border-bottom: 2px solid white;
            margin: 5px 0;
        }
        .hidden {
            display: none;
        }
        .highlight {
            color: #e74c3c;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        .fade-in {
            animation: fadeIn 1s forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .explanation {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>เครื่องจักรการคูณ ⚙️</h2>
    
    <div class="input-group">
        <label>ตัวตั้ง (สูงสุด 3 หลัก):</label>
        <input type="number" id="num1" max="999" value="23">
    </div>
    <div class="input-group">
        <label>ตัวคูณ (สูงสุด 2 หลัก):</label>
        <input type="number" id="num2" max="99" value="14">
    </div>
    
    <button onclick="startAnimation()">เริ่มคำนวณ</button>

    <div class="math-board" id="board">
        รอการคำนวณ...
    </div>

    <div class="explanation" id="explainBox"></div>
</div>

<script>
    async function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startAnimation() {
        const num1 = parseInt(document.getElementById('num1').value);
        const num2 = parseInt(document.getElementById('num2').value);
        const board = document.getElementById('board');
        const explainBox = document.getElementById('explainBox');

        if (isNaN(num1) || isNaN(num2)) {
            board.innerHTML = "โปรดใส่ตัวเลขให้ครบครับ!";
            return;
        }

        const num2Str = num2.toString();
        const num1Str = num1.toString();
        
        // Reset board
        board.innerHTML = '';
        explainBox.innerHTML = '';

        // Step 1: Show Multiplicand and Multiplier
        let html = `
            <div class="fade-in">${num1Str.padStart(6, '&nbsp;')}</div>
            <div class="fade-in">x${num2Str.padStart(5, '&nbsp;')}</div>
            <div class="line fade-in"></div>
        `;
        board.innerHTML = html;
        explainBox.innerHTML = "<b>ขั้นตอนที่ 1:</b> ตั้งหลักให้ตรงกัน";
        await sleep(1500);

        let partialProducts = [];
        
        // Loop through multiplier digits from right to left
        for (let i = num2Str.length - 1; i >= 0; i--) {
            const digit = parseInt(num2Str[i]);
            const position = num2Str.length - 1 - i; // 0 for units, 1 for tens
            
            const product = num1 * digit;
            // Pad with zeros based on position (e.g., *10 for tens digit)
            const displayProduct = product + '0'.repeat(position);
            partialProducts.push(parseInt(displayProduct));

            // Step 2 & 3: Show Partial Products
            let stepHtml = `<div class="fade-in">`;
            
            if (position === 1) {
                 explainBox.innerHTML = "<b>ขั้นตอนที่ 3:</b> นำหลักสิบไปคูณ <br><span style='color:#e74c3c;'>อย่าลืมเติม 0 ที่หลักหน่วยเสมอ! เพราะเรากำลังคูณด้วยหลักสิบ</span>";
                 stepHtml += `${displayProduct.padStart(6, '&nbsp;').replace(/0$/, '<span class="highlight">0</span>')}`;
            } else {
                 explainBox.innerHTML = `<b>ขั้นตอนที่ 2:</b> นำหลักหน่วย (${digit}) ไปคูณตัวตั้งทั้งหมด`;
                 stepHtml += `${displayProduct.padStart(6, '&nbsp;')}`;
            }
            
            stepHtml += `</div>`;
            board.innerHTML += stepHtml;
            await sleep(2000);
        }

        // Step 4: Show Final Sum (if more than 1 partial product)
        if (partialProducts.length > 1) {
            board.innerHTML += `<div class="line fade-in"></div>`;
            const finalSum = partialProducts.reduce((a, b) => a + b, 0);
            
            explainBox.innerHTML = "<b>ขั้นตอนสุดท้าย:</b> นำผลคูณย่อยมาบวกกัน";
            board.innerHTML += `<div class="fade-in highlight">${finalSum.toString().padStart(6, '&nbsp;')}</div>`;
            board.innerHTML += `<div class="line fade-in" style="border-bottom-style: double;"></div>`;
        }
    }
</script>

</body>
</html>
