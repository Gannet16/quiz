<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทบทวนคณิตศาสตร์ สัปดาห์ที่ 1</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f4f1ff; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
#app { max-width: 680px; width: 100%; padding: 1.5rem; }
.screen { display: none; }
.screen.active { display: block; }

/* WELCOME */
#welcome { text-align: center; padding: 2rem 1rem; }
.hero-emoji { font-size: 72px; margin-bottom: 1rem; display: inline-block; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
.welcome-title { font-size: 28px; font-weight: 700; color: #3C3489; margin-bottom: 0.5rem; }
.welcome-sub { font-size: 15px; color: #666; margin-bottom: 2rem; font-family: 'Sarabun', sans-serif; line-height: 1.6; }
.section-pills { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 1.5rem; }
.section-pill { padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; font-family: 'Kanit', sans-serif; }
.section-pill:hover { transform: scale(1.05); }
.section-pill.s1 { background: #EEEDFE; color: #3C3489; border-color: #AFA9EC; }
.section-pill.s2 { background: #E1F5EE; color: #0F6E56; border-color: #5DCAA5; }
.section-pill.s3 { background: #FAECE7; color: #993C1D; border-color: #F0997B; }
.section-pill.s4 { background: #FAEEDA; color: #633806; border-color: #EF9F27; }
.section-pill.s5 { background: #EAF3DE; color: #3B6D11; border-color: #97C459; }
.section-pill.off { opacity: 0.4; transform: scale(0.95); }
.mode-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; }
.mode-btn { padding: 9px 20px; border: 2px solid #ccc; border-radius: 10px; font-size: 14px; font-family: 'Kanit', sans-serif; background: white; color: #888; cursor: pointer; transition: all 0.2s; }
.mode-btn.active { border-color: #534AB7; color: #3C3489; background: #EEEDFE; font-weight: 500; }
.start-btn { background: #534AB7; color: white; border: none; padding: 15px 48px; border-radius: 14px; font-size: 20px; font-weight: 700; font-family: 'Kanit', sans-serif; cursor: pointer; transition: all 0.2s; width: 100%; max-width: 320px; margin-top: 0.5rem; }
.start-btn:hover { background: #3C3489; transform: scale(1.02); }
.pill-label { font-size: 13px; color: #888; margin-bottom: 8px; }

/* QUIZ */
#quiz { padding: 0.5rem 0; }
.quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; background: white; border-radius: 14px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(83,74,183,0.08); }
.back-btn { background: none; border: 1.5px solid #ddd; border-radius: 8px; padding: 7px 13px; font-size: 13px; color: #888; cursor: pointer; font-family: 'Kanit', sans-serif; white-space: nowrap; }
.back-btn:hover { border-color: #534AB7; color: #534AB7; }
.progress-wrap { flex: 1; }
.progress-label { font-size: 11px; color: #bbb; margin-bottom: 4px; text-align: right; }
.progress-bar-bg { background: #f0eeff; border-radius: 99px; height: 9px; overflow: hidden; }
.progress-bar { height: 9px; border-radius: 99px; background: linear-gradient(90deg, #534AB7, #AFA9EC); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
.q-counter { font-size: 14px; color: #534AB7; font-weight: 500; white-space: nowrap; }
.score-live { font-size: 14px; font-weight: 700; color: #534AB7; white-space: nowrap; }

.combo-banner { display: none; background: #FAEEDA; border: 2px solid #EF9F27; border-radius: 10px; padding: 8px 16px; text-align: center; margin-bottom: 1rem; font-size: 15px; color: #633806; font-weight: 700; animation: popIn 0.3s ease; }
@keyframes popIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }

.section-badge { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-bottom: 0.75rem; }
.q-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 2px 12px rgba(83,74,183,0.08); border: 1.5px solid #f0eeff; }
.q-num { font-size: 12px; color: #bbb; margin-bottom: 6px; }
.q-text { font-size: 18px; font-weight: 500; color: #222; line-height: 1.7; font-family: 'Sarabun', sans-serif; }
.hint-badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 20px; font-size: 13px; background: #FAEEDA; color: #BA7517; border: 1px solid #EF9F27; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
.choice-btn { background: white; border: 2px solid #e8e6ff; border-radius: 12px; padding: 13px 14px; font-size: 15px; font-family: 'Kanit', sans-serif; color: #333; cursor: pointer; text-align: left; transition: all 0.18s; line-height: 1.5; box-shadow: 0 1px 4px rgba(83,74,183,0.05); }
.choice-btn:hover:not(:disabled) { border-color: #AFA9EC; background: #EEEDFE; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(83,74,183,0.12); }
.choice-btn.correct { background: #EAF3DE; border-color: #639922; color: #27500A; }
.choice-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #A32D2D; }
.choice-btn:disabled { cursor: default; transform: none; }
.choice-letter { font-weight: 700; margin-right: 6px; opacity: 0.6; }

.feedback-box { border-radius: 12px; padding: 14px 18px; margin-bottom: 1.25rem; display: none; animation: slideUp 0.3s ease; }
@keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.feedback-box.correct { background: #EAF3DE; border: 1.5px solid #639922; }
.feedback-box.wrong { background: #FCEBEB; border: 1.5px solid #E24B4A; }
.feedback-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
.feedback-box.correct .feedback-title { color: #27500A; }
.feedback-box.wrong .feedback-title { color: #A32D2D; }
.feedback-text { font-size: 14px; color: #555; font-family: 'Sarabun', sans-serif; line-height: 1.7; }

.next-btn { background: #534AB7; color: white; border: none; padding: 14px 28px; border-radius: 12px; font-size: 17px; font-weight: 700; font-family: 'Kanit', sans-serif; cursor: pointer; width: 100%; display: none; transition: background 0.2s, transform 0.1s; }
.next-btn:hover { background: #3C3489; }
.next-btn:active { transform: scale(0.98); }

/* RESULT */
#result { text-align: center; padding: 1.5rem 0.5rem; }
.result-card { background: white; border-radius: 20px; padding: 2rem 1.5rem; box-shadow: 0 4px 20px rgba(83,74,183,0.12); }
.result-emoji { font-size: 72px; margin-bottom: 0.75rem; display: inline-block; animation: popIn 0.5s cubic-bezier(.4,0,.2,1); }
.result-title { font-size: 26px; font-weight: 700; color: #3C3489; margin-bottom: 0.5rem; }
.result-sub { font-size: 15px; color: #777; margin-bottom: 1.5rem; font-family: 'Sarabun', sans-serif; }
.score-big { font-size: 64px; font-weight: 700; color: #534AB7; line-height: 1; }
.score-label { font-size: 16px; color: #aaa; margin-bottom: 2rem; }
.section-breakdown { text-align: left; margin-bottom: 2rem; }
.breakdown-title { font-size: 14px; color: #999; margin-bottom: 12px; border-top: 1px solid #f0eeff; padding-top: 16px; }
.breakdown-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.breakdown-name { font-size: 13px; color: #444; width: 150px; flex-shrink: 0; }
.breakdown-bar-bg { flex: 1; height: 9px; background: #f0eeff; border-radius: 99px; overflow: hidden; }
.breakdown-bar { height: 9px; border-radius: 99px; transition: width 1s cubic-bezier(.4,0,.2,1) 0.4s; }
.breakdown-pct { font-size: 12px; color: #888; width: 36px; text-align: right; font-weight: 500; }
.result-btns { display: flex; gap: 10px; }
.restart-btn { background: #534AB7; color: white; border: none; padding: 13px 28px; border-radius: 12px; font-size: 16px; font-weight: 700; font-family: 'Kanit', sans-serif; cursor: pointer; flex: 1; transition: background 0.2s; }
.restart-btn:hover { background: #3C3489; }
.review-btn { background: white; color: #534AB7; border: 2px solid #534AB7; padding: 13px 28px; border-radius: 12px; font-size: 16px; font-weight: 700; font-family: 'Kanit', sans-serif; cursor: pointer; flex: 1; transition: all 0.2s; }
.review-btn:hover { background: #EEEDFE; }
</style>
</head>
<body>
<div id="app">

  <!-- WELCOME -->
  <div id="welcome" class="screen active">
    <div style="text-align:center; padding: 2rem 1rem;">
      <div class="hero-emoji">🧮</div>
      <div class="welcome-title">ทบทวนคณิตศาสตร์ สัปดาห์ที่ 1</div>
      <div class="welcome-sub">การจัดการจำนวน • 30 ข้อ<br>เนื้อหาวันที่ 27 เม.ย. – 1 พ.ค. 2569</div>
      <div class="pill-label">เลือกส่วนที่ต้องการฝึก (กดเพื่อเปิด/ปิด)</div>
      <div class="section-pills" id="sectionPills"></div>
      <div class="mode-row">
        <button class="mode-btn active" id="modeAll" onclick="setMode('all')">ทุกส่วน (30 ข้อ)</button>
        <button class="mode-btn" id="modeSel" onclick="setMode('selected')">เฉพาะที่เลือก</button>
      </div>
      <button class="start-btn" onclick="startQuiz()">เริ่มทำข้อสอบ ▶</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen">
    <div class="quiz-top">
      <button class="back-btn" onclick="goHome()">← กลับ</button>
      <div class="progress-wrap">
        <div class="progress-bar-bg"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      </div>
      <div class="q-counter" id="qCounter">1/30</div>
      <div class="score-live" id="scoreLive">0 คะแนน</div>
    </div>
    <div class="combo-banner" id="comboBanner"></div>
    <div class="section-badge" id="sectionBadge"></div>
    <div class="q-card">
      <div class="q-num" id="qNum"></div>
      <div class="q-text" id="qText"></div>
      <div id="qHint"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback-box" id="feedbackBox">
      <div class="feedback-title" id="feedbackTitle"></div>
      <div class="feedback-text" id="feedbackText"></div>
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()">ข้อต่อไป →</button>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="score-big" id="scoreBig"></div>
      <div class="score-label" id="scoreLabel"></div>
      <div class="section-breakdown" id="breakdown"></div>
      <div class="result-btns">
        <button class="review-btn" onclick="startQuiz()">ทำอีกครั้ง 🔄</button>
        <button class="restart-btn" onclick="goHome()">เลือกส่วนใหม่</button>
      </div>
    </div>
  </div>

</div>

<script>
const SECTIONS = [
  { id: 1, short: "จำนวนเฉพาะ", cls: "s1", bg: "#EEEDFE", color: "#3C3489", bar: "#534AB7" },
  { id: 2, short: "ห.ร.ม./ค.ร.น.", cls: "s2", bg: "#E1F5EE", color: "#0F6E56", bar: "#1D9E75" },
  { id: 3, short: "โจทย์ปัญหา", cls: "s3", bg: "#FAECE7", color: "#993C1D", bar: "#D85A30" },
  { id: 4, short: "PEMDAS", cls: "s4", bg: "#FAEEDA", color: "#633806", bar: "#BA7517" },
  { id: 5, short: "จำนวนเต็ม", cls: "s5", bg: "#EAF3DE", color: "#3B6D11", bar: "#639922" }
];

const QUESTIONS = [
  { s:1, q:'ข้อใดให้ความหมายของ "จำนวนเฉพาะ" ได้ถูกต้องที่สุด?', choices:['จำนวนที่หารด้วย 2 ลงตัวเสมอ','จำนวนที่มีเพียง 1 และตัวมันเองที่หารลงตัว','จำนวนที่เป็นเลขคี่ทุกตัว','จำนวนที่มากกว่า 0'], ans:1, explain:'จำนวนเฉพาะ คือ จำนวนที่มีตัวประกอบพอดี 2 ตัว ได้แก่ 1 และตัวเองเท่านั้น' },
  { s:1, q:'ตัวเลขในข้อใดเป็นจำนวนเฉพาะทั้งหมด?', choices:['2, 3, 5, 9','2, 7, 11, 13','1, 3, 5, 7','2, 4, 6, 8'], ans:1, explain:'9 = 3×3 ไม่ใช่จำนวนเฉพาะ, 1 ไม่ใช่จำนวนเฉพาะ, 4,6,8 หารด้วย 2 ลงตัว แต่ 2, 7, 11, 13 เป็นจำนวนเฉพาะทั้งหมด' },
  { s:1, q:'"1 ไม่ใช่จำนวนเฉพาะ" ประโยคนี้จริงหรือไม่?', choices:['ไม่จริง เพราะ 1 หารตัวมันเองลงตัว','จริง เพราะจำนวนเฉพาะต้องเป็นเลขคู่','จริง เพราะ 1 มีตัวประกอบเพียง 1 ตัว แต่จำนวนเฉพาะต้องมี 2 ตัว','ไม่จริง เพราะ 1 เป็นจุดเริ่มต้นของตัวเลข'], ans:2, explain:'จำนวนเฉพาะต้องมีตัวประกอบพอดี 2 ตัว (1 กับตัวเอง) แต่ 1 มีตัวประกอบแค่ 1 ตัว จึงไม่ใช่จำนวนเฉพาะ' },
  { s:1, q:'จำนวนเฉพาะที่น้อยที่สุดและเป็นเลขคู่เพียงตัวเดียวคือ?', choices:['0','1','2','4'], ans:2, explain:'2 มีตัวประกอบแค่ 1 และ 2 จึงเป็นจำนวนเฉพาะ และเป็นเลขคู่เพียงตัวเดียวในบรรดาจำนวนเฉพาะทั้งหมด' },
  { s:1, q:'การแยกตัวประกอบของ 36 ข้อใดถูกต้องที่สุด?', choices:['4 × 9','6 × 6','2 × 2 × 3 × 3','2 × 18'], ans:2, explain:'การแยกตัวประกอบที่สมบูรณ์ต้องได้ตัวประกอบที่เป็นจำนวนเฉพาะทั้งหมด: 36 = 2² × 3²' },
  { s:1, q:'ผลคูณของ 2³ × 5 คือการแยกตัวประกอบของจำนวนใด?', choices:['10','30','40','50'], ans:2, hint:'คำนวณ 2³ ก่อน แล้วค่อยคูณด้วย 5', explain:'2³ = 8 แล้ว 8 × 5 = 40' },
  { s:2, q:'ห.ร.ม. ของ 18 และ 24 คือข้อใด?', choices:['2','3','6','72'], ans:2, explain:'18 = 2 × 3², 24 = 2³ × 3, ห.ร.ม. = 2 × 3 = 6' },
  { s:2, q:'ค.ร.น. ของ 8 และ 12 คือข้อใด?', choices:['2','4','24','96'], ans:2, explain:'8 = 2³, 12 = 2² × 3, ค.ร.น. = 2³ × 3 = 24' },
  { s:2, q:'ห.ร.ม. ของจำนวนเฉพาะสองจำนวน (เช่น 7 และ 11) มีค่าเท่าไร?', choices:['1','0','ผลคูณของสองจำนวนนั้น','หาไม่ได้'], ans:0, explain:'จำนวนเฉพาะสองจำนวนต่างกันไม่มีตัวประกอบร่วม ยกเว้น 1 ดังนั้น ห.ร.ม. = 1 เสมอ' },
  { s:2, q:'ค.ร.น. ของ 3, 4 และ 5 คือข้อใด?', choices:['12','20','60','120'], ans:2, explain:'3=3, 4=2², 5=5 ค.ร.น. = 2² × 3 × 5 = 60' },
  { s:2, q:'ห.ร.ม. และ ค.ร.น. ของ 6 และ 8 ต่างกันเท่าไร?', choices:['12','22','24','26'], ans:1, explain:'ห.ร.ม.(6,8) = 2, ค.ร.น.(6,8) = 24, ผลต่าง = 24 - 2 = 22' },
  { s:2, q:'การหา ห.ร.ม. ด้วยวิธีหารสั้น ตัวหารต้องมีสมบัติอย่างไร?', choices:['หารลงตัวอย่างน้อย 2 ตัว','หารลงตัวทุกตัว','เป็นเลขคู่เท่านั้น','เป็นเลขคี่เท่านั้น'], ans:1, explain:'วิธีหารสั้นสำหรับ ห.ร.ม. ตัวหารต้องหารลงตัวทุกตัวพร้อมกัน' },
  { s:3, q:'คีย์เวิร์ดใดบ่งบอกว่าต้องใช้ ค.ร.น. ในการแก้ปัญหา?', choices:['แบ่งให้เท่ากัน','มากที่สุด','พร้อมกันอีกครั้ง','ไม่เหลือเศษ'], ans:2, explain:'"พร้อมกันอีกครั้ง" บ่งชี้ว่าต้องหาจุดที่หลายสิ่งมาบรรจบกัน ซึ่งคือ ค.ร.น.' },
  { s:3, q:'คีย์เวิร์ดใดบ่งบอกว่าต้องใช้ ห.ร.ม. ในการแก้ปัญหา?', choices:['เจอกันครั้งถัดไป','จัดกลุ่มให้ได้มากที่สุด','วิ่งรอบสนาม','น้อยที่สุด'], ans:1, explain:'"จัดกลุ่มให้ได้มากที่สุด" (แบ่งอย่างเท่าๆ กัน) คือสัญญาณของ ห.ร.ม.' },
  { s:3, q:'มีส้ม 30 ผล และแอปเปิ้ล 45 ผล แบ่งใส่ถุงให้ได้มากที่สุดโดยไม่ปนกัน จะได้ถุงละกี่ผล?', choices:['5 ผล','10 ผล','15 ผล','30 ผล'], ans:2, hint:'หา ห.ร.ม. ของ 30 และ 45', explain:'ห.ร.ม.(30, 45) = 15 ดังนั้นแบ่งได้ถุงละ 15 ผล' },
  { s:3, q:'สัญญาณไฟ 3 ดวง กะพริบทุกๆ 4, 6 และ 8 วินาที อีกกี่วินาทีจะกะพริบพร้อมกันอีกครั้ง?', choices:['12 วินาที','24 วินาที','48 วินาที','64 วินาที'], ans:1, hint:'หา ค.ร.น. ของ 4, 6 และ 8', explain:'ค.ร.น.(4, 6, 8) = 24 วินาที' },
  { s:3, q:'มีเชือก 12 ม., 18 ม. และ 24 ม. ตัดให้ยาวเท่ากันและยาวที่สุด ได้เส้นละกี่เมตร?', choices:['2 ม.','3 ม.','6 ม.','12 ม.'], ans:2, hint:'หา ห.ร.ม. ของ 12, 18 และ 24', explain:'ห.ร.ม.(12, 18, 24) = 6 เมตร' },
  { s:3, q:'แดงไปห้างทุก 5 วัน ดำไปทุก 7 วัน วันนี้เจอกัน อีกกี่วันจะเจอกันอีกครั้ง?', choices:['12 วัน','25 วัน','35 วัน','70 วัน'], ans:2, hint:'หา ค.ร.น. ของ 5 และ 7', explain:'ค.ร.น.(5, 7) = 35 วัน เพราะ 5 และ 7 เป็นจำนวนเฉพาะ ค.ร.น. = 5 × 7 = 35' },
  { s:4, q:'5 + 3 × 2 = ?', choices:['16','11','10','21'], ans:1, hint:'คูณก่อน บวกทีหลัง (PEMDAS)', explain:'คูณก่อน: 3 × 2 = 6 แล้วบวก: 5 + 6 = 11' },
  { s:4, q:'(10 - 4) ÷ 2 + 1 = ?', choices:['4','2','6','8'], ans:0, hint:'วงเล็บก่อนเสมอ!', explain:'วงเล็บ: (10-4)=6 → หาร: 6÷2=3 → บวก: 3+1=4' },
  { s:4, q:'2³ + 4 × 5 = ?', choices:['28','60','32','26'], ans:0, hint:'ยกกำลังก่อน แล้วค่อยคูณ จากนั้นจึงบวก', explain:'ยกกำลัง: 2³=8 → คูณ: 4×5=20 → บวก: 8+20=28' },
  { s:4, q:'20 ÷ 5 × 2 = ? (ระวังโดนหลอก!)', choices:['2','4','8','10'], ans:2, hint:'หารและคูณอยู่ระดับเดียวกัน ทำจากซ้ายไปขวา', explain:'ทำซ้ายไปขวา: 20÷5=4 แล้ว 4×2=8' },
  { s:4, q:'15 - 3 × 4 + 8 = ?', choices:['56','11','3','-5'], ans:1, hint:'คูณก่อน แล้วทำบวก/ลบจากซ้ายไปขวา', explain:'คูณก่อน: 3×4=12 → 15-12=3 → 3+8=11' },
  { s:4, q:'2 × [3 + (6 ÷ 2)] = ?', choices:['12','9','15','18'], ans:0, hint:'วงเล็บในสุดก่อน แล้วค่อยออกมา', explain:'วงเล็บใน: 6÷2=3 → วงเล็บนอก: 3+3=6 → คูณ: 2×6=12' },
  { s:5, q:'บนเส้นจำนวน เลขที่อยู่ทางขวาสุดในกลุ่มนี้คือ?', choices:['-10','-5','0','-1'], ans:2, explain:'บนเส้นจำนวน ยิ่งขวายิ่งมีค่ามาก ดังนั้น 0 > -1 > -5 > -10 เลขที่ขวาสุดคือ 0' },
  { s:5, q:'ข้อใดเปรียบเทียบจำนวนได้ถูกต้อง?', choices:['-5 > -2','-10 < -15','0 < -1','-3 > -8'], ans:3, explain:'บนเส้นจำนวน -3 อยู่ทางขวาของ -8 ดังนั้น -3 > -8 ถูกต้อง' },
  { s:5, q:'(-5) + 8 = ? (เป็นหนี้ 5 บาท ได้เงินมา 8 บาท)', choices:['3','-3','13','-13'], ans:0, hint:'เริ่มที่ -5 เดินขวา 8 ก้าวบนเส้นจำนวน', explain:'-5+8=3 ได้เงินมากกว่าหนี้จึงมีเหลือ 3 บาท' },
  { s:5, q:'(-3) - 4 = ? (เป็นหนี้ 3 บาท ยืมเพิ่มอีก 4 บาท)', choices:['1','-1','7','-7'], ans:3, hint:'ลบออก = เดินซ้ายบนเส้นจำนวน', explain:'เริ่มที่ -3 เดินซ้าย 4 หน่วย: -3-4=-7' },
  { s:5, q:'น้องยืนที่ -2 แล้วเดินขวา 6 หน่วย จะไปหยุดที่ไหน?', choices:['4','-8','8','-4'], ans:0, hint:'เดินขวา = บวก', explain:'-2+6=4' },
  { s:5, q:'อุณหภูมิตอนเช้า 2°C ตกกลางคืนลดลง 6°C อุณหภูมิกลางคืนคือ?', choices:['8°C','4°C','-4°C','-8°C'], ans:2, hint:'ลดลง = ลบออก', explain:'2-6=-4°C อุณหภูมิต่ำกว่า 0 องศา' }
];

let mode = 'all';
let selectedSections = new Set([1,2,3,4,5]);
let activeQs = [], qIdx = 0, score = 0, combo = 0;
let answered = false;
let sectionStats = {};

function setMode(m) {
  mode = m;
  document.getElementById('modeAll').classList.toggle('active', m==='all');
  document.getElementById('modeSel').classList.toggle('active', m==='selected');
  renderPills();
}

function toggleSection(id) {
  if (mode==='all') setMode('selected');
  if (selectedSections.has(id)) { if (selectedSections.size>1) selectedSections.delete(id); }
  else selectedSections.add(id);
  renderPills();
}

function renderPills() {
  document.getElementById('sectionPills').innerHTML = SECTIONS.map(s =>
    `<button class="section-pill ${s.cls}${(mode==='selected' && !selectedSections.has(s.id)) ? ' off' : ''}" onclick="toggleSection(${s.id})">${s.short}</button>`
  ).join('');
}

function startQuiz() {
  const pool = mode==='all' ? QUESTIONS : QUESTIONS.filter(q=>selectedSections.has(q.s));
  activeQs = [...pool].sort(()=>Math.random()-0.5);
  qIdx=0; score=0; combo=0; answered=false;
  sectionStats = {};
  SECTIONS.forEach(s => sectionStats[s.id] = {correct:0, total:0});
  showScreen('quiz');
  renderQ();
}

function renderQ() {
  const q = activeQs[qIdx];
  answered = false;
  const total = activeQs.length;
  document.getElementById('progressBar').style.width = (qIdx/total*100)+'%';
  document.getElementById('qCounter').textContent = (qIdx+1)+'/'+total;
  document.getElementById('scoreLive').textContent = score+' คะแนน';
  const sc = SECTIONS.find(s=>s.id===q.s);
  const badge = document.getElementById('sectionBadge');
  badge.textContent = sc.short;
  badge.style.background = sc.bg; badge.style.color = sc.color;
  document.getElementById('qNum').textContent = 'ข้อที่ '+(qIdx+1);
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qHint').innerHTML = q.hint ? `<span class="hint-badge">💡 ${q.hint}</span>` : '';
  document.getElementById('choices').innerHTML = q.choices.map((c,i) =>
    `<button class="choice-btn" onclick="choose(${i})"><span class="choice-letter">${['ก','ข','ค','ง'][i]}.</span>${c}</button>`
  ).join('');
  document.getElementById('feedbackBox').style.display='none';
  document.getElementById('comboBanner').style.display='none';
  const nb = document.getElementById('nextBtn');
  nb.style.display='none';
  nb.textContent = qIdx+1<activeQs.length ? 'ข้อต่อไป →' : 'ดูผลคะแนน 🎉';
}

function choose(i) {
  if (answered) return;
  answered = true;
  const q = activeQs[qIdx];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled=true);
  const ok = i===q.ans;
  btns[i].classList.add(ok?'correct':'wrong');
  if (!ok) btns[q.ans].classList.add('correct');
  sectionStats[q.s].total++;
  if (ok) { score++; combo++; sectionStats[q.s].correct++; }
  else combo=0;
  const fb = document.getElementById('feedbackBox');
  fb.className = 'feedback-box '+(ok?'correct':'wrong');
  fb.style.display='block';
  document.getElementById('feedbackTitle').textContent = ok ? (combo>=3?`🔥 Combo ×${combo}! ยอดเยี่ยมมาก!`:'✓ ถูกต้องเลย!') : '✗ ยังไม่ถูกนะ';
  document.getElementById('feedbackText').textContent = q.explain;
  document.getElementById('scoreLive').textContent = score+' คะแนน';
  if (ok && combo>=3) {
    const cb = document.getElementById('comboBanner');
    cb.textContent = `🔥 เก่งมาก! ตอบถูกติดต่อกัน ${combo} ข้อ!`;
    cb.style.display='block';
  }
  document.getElementById('nextBtn').style.display='block';
}

function nextQ() {
  qIdx++;
  if (qIdx>=activeQs.length) { showResult(); return; }
  renderQ();
}

function showResult() {
  showScreen('result');
  const total = activeQs.length;
  const pct = Math.round(score/total*100);
  let emoji='😔', title='ยังต้องฝึกเพิ่มนะ!', sub='ไม่เป็นไร ลองทำใหม่อีกครั้งได้เลย ค่อยๆ ฝึกนะ';
  if (pct>=90){emoji='🏆';title='เก่งมากเลย!';sub='คะแนนเกือบเต็มเลย ความพยายามน่าชื่นชมมาก!';}
  else if (pct>=75){emoji='⭐';title='ทำได้ดีมาก!';sub='เข้าใจเนื้อหาดี ฝึกอีกนิดก็สมบูรณ์แล้ว';}
  else if (pct>=60){emoji='👍';title='ผ่านแล้ว!';sub='ยังมีส่วนที่ต้องทบทวน ลองทำอีกครั้งนะ';}
  document.getElementById('resultEmoji').textContent=emoji;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultSub').textContent=sub;
  document.getElementById('scoreBig').textContent=score+'/'+total;
  document.getElementById('scoreLabel').textContent=`คะแนน ${pct}%`;
  const activeSecs = [...new Set(activeQs.map(q=>q.s))];
  document.getElementById('breakdown').innerHTML = '<div class="breakdown-title">ผลแยกตามหัวข้อ</div>' +
    activeSecs.map(sid => {
      const st = sectionStats[sid]; if(!st||st.total===0) return '';
      const p = Math.round(st.correct/st.total*100);
      const sc = SECTIONS.find(s=>s.id===sid);
      return `<div class="breakdown-row"><div class="breakdown-name">${sc.short}</div><div class="breakdown-bar-bg"><div class="breakdown-bar" style="width:${p}%;background:${sc.bar}"></div></div><div class="breakdown-pct">${p}%</div></div>`;
    }).join('');
}

function goHome() { showScreen('welcome'); }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

renderPills();
</script>
